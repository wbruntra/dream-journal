<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14152c" />
      <stop offset="50%" stop-color="#0f1020" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moonGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ddd6fe" />
      <stop offset="80%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#nebulaGlow)" />

  <!-- Crescent Moon -->
  <path d="M280 130 C200 130 135 195 135 275 C135 355 200 420 280 420 C325 420 365 399 390 367 C305 380 230 310 230 225 C230 178 252 142 280 130 Z" 
        fill="url(#moonGrad)" filter="url(#glow)" />

  <!-- Stars / Sparkles -->
  <path d="M375 145 Q375 180 410 180 Q375 180 375 215 Q375 180 340 180 Q375 180 375 145 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="375" cy="180" r="4" fill="#ffffff" />

  <path d="M400 290 Q400 312 422 312 Q400 312 400 334 Q400 312 378 312 Q400 312 400 290 Z" fill="#c4b5fd" />
  <circle cx="400" cy="312" r="2.5" fill="#ffffff" />

  <path d="M150 360 Q150 375 165 375 Q150 375 150 390 Q150 375 135 375 Q150 375 150 360 Z" fill="#fde68a" opacity="0.9" />

  <circle cx="170" cy="170" r="3" fill="#e0e7ff" opacity="0.8" />
  <circle cx="310" cy="100" r="2.5" fill="#bae6fd" opacity="0.7" />

  <!-- Audio Wave Ripple arcs -->
  <path d="M 230 380 A 60 25 0 0 0 310 380" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 205 405 A 95 38 0 0 0 335 405" stroke="#818cf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />
</svg>
